  <style>
:root {
  --bg: #0e1116;

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 12px 16px;
  background: rgba(14, 17, 22, 0.92);
  border-bottom: 1px solid var(--line);
}
header h1 { margin: 0; font-size: 1.2rem; }
.tag { color: var(--muted); font-size: 0.8rem; }

main {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.viewer {
  position: relative;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.viewer video,
.viewer canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: manipulation;
}
#frameCanvas { cursor: crosshair; }

.hint {
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.65);
  color: #fff;
  font-size: 0.85rem;
  white-space: nowrap;
  pointer-events: none;
}

.hidden { display: none !important; }

.progress {
  height: 6px;
  border-radius: 3px;
  background: var(--line);
  overflow: hidden;
}
#progressBar {
  height: 100%;
  width: 100%;
  background: var(--accent);
  transform-origin: left center;
  transform: scaleX(0);
  transition: transform 0.15s linear;
}

.status { font-size: 0.9rem; color: var(--muted); line-height: 1.4; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.status.err { color: var(--err); }

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

button {
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  font-size: 1rem;
  font-weight: 600;
}
button.primary { background: var(--accent); color: #002233; border-color: transparent; }
button.small { min-height: 38px; font-size: 0.85rem; font-weight: 500; }
button:disabled { opacity: 0.4; }
button:active:not(:disabled) { transform: scale(0.98); }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
details.panel { display: block; }
details.panel > * + * { margin-top: 10px; }
summary { cursor: pointer; font-weight: 600; }

.field {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 0.92rem;
}
.field input[type="number"] {
  width: 96px;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
  font-size: 0.95rem;
}
.field input[type="file"] { max-width: 60%; color: var(--muted); font-size: 0.8rem; }

input[type="range"] { width: 100%; accent-color: var(--accent); }

.note { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.45; }

.result-label { color: var(--muted); font-size: 0.85rem; }
.distance { font-size: 2.6rem; font-weight: 700; line-height: 1.1; }
.meta { color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
.meta .warn { color: var(--warn); }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }

.sw.line { background: var(--accent); }

  <script type="module">
// ---- focus.js ----
// Focus measure + peak finding (depth from focus).

/** RGBA ImageData -> 8-bit luminance. */
function toGray(imageData) {
  const src = imageData.data;
  const out = new Uint8ClampedArray(imageData.width * imageData.height);
  for (let i = 0, j = 0; j < out.length; i += 4, j++) {
    out[j] = (src[i] * 77 + src[i + 1] * 150 + src[i + 2] * 29) >> 8;
  }
  return out;
}

/**
 * Tenengrad (Sobel gradient energy) in a (2r+1)^2 window around (cx, cy),
 * normalised by mean brightness so auto-exposure changes between frames
 * don't masquerade as focus changes.
 */
function sharpness(gray, w, h, cx, cy, r) {
  const x0 = Math.max(1, cx - r);
  const x1 = Math.min(w - 2, cx + r);
  const y0 = Math.max(1, cy - r);
  const y1 = Math.min(h - 2, cy + r);
  let energy = 0;
  let sum = 0;
  let n = 0;
  for (let y = y0; y <= y1; y++) {
    const row = y * w;
    for (let x = x0; x <= x1; x++) {
      const i = row + x;
      const tl = gray[i - w - 1], tc = gray[i - w], tr = gray[i - w + 1];
      const ml = gray[i - 1], mr = gray[i + 1];
      const bl = gray[i + w - 1], bc = gray[i + w], br = gray[i + w + 1];
      const gx = tr + 2 * mr + br - tl - 2 * ml - bl;
      const gy = bl + 2 * bc + br - tl - 2 * tc - tr;
      energy += gx * gx + gy * gy;
      sum += gray[i];
      n++;
    }
  }
  if (!n) return 0;
  const mean = sum / n;
  return energy / n / (mean * mean + 100);
}

function sharpnessCurve(frames, x, y, r) {
  const cx = Math.round(x);
  const cy = Math.round(y);
  return frames.map((f) => sharpness(f.gray, f.width, f.height, cx, cy, r));
}

/**
 * xs: diopters (ascending), ys: sharpness.
 * Returns the refined diopter of best focus plus quality info.
 */
function findPeak(xs, ys) {
  const n = ys.length;
  if (n < 3) return null;

  // light [1 2 1] smoothing to suppress sensor noise. Edges use replicate
  // padding so end points are smoothed like interior ones (leaving them raw
  // made a noisy end frame beat a real, smoothed-down interior peak).
  const s = ys.map((v, i) => (ys[Math.max(0, i - 1)] + 2 * v + ys[Math.min(n - 1, i + 1)]) / 4);

  let i = 0;
  for (let k = 1; k < n; k++) if (s[k] > s[i]) i = k;

  // An end-point maximum only means "outside the swept range". If there is a
  // real interior peak of similar height, trust that instead.
  if (i === 0 || i === n - 1) {
    let best = -1;
    for (let k = 1; k < n - 1; k++) {
      if (s[k] >= s[k - 1] && s[k] >= s[k + 1] && (best < 0 || s[k] > s[best])) best = k;
    }
    if (best >= 0 && s[best] >= 0.85 * s[i]) i = best;
  }

  // Region of best focus: the contiguous run around the maximum that is
  // within 20% of the curve's height range from the top. Far away (and at a
  // lens that bottoms out) several frames are equally sharp; that whole run
  // is the answer, not whichever end of it is noisiest.
  let lo = Infinity;
  for (const v of s) lo = Math.min(lo, v);
  const thr = lo + 0.8 * (s[i] - lo);
  let a = i;
  let b = i;
  while (a > 0 && s[a - 1] >= thr) a--;
  while (b < n - 1 && s[b + 1] >= thr) b++;

  let peak = xs[i];
  if (b - a >= 3) {
    // plateau: weighted centroid in diopters
    let w = 0;
    let wx = 0;
    for (let k = a; k <= b; k++) {
      const wk = s[k] - thr + 1e-12;
      w += wk;
      wx += wk * xs[k];
    }
    peak = wx / w;
  } else if (i > 0 && i < n - 1) {
    // Gaussian fit = parabola through log values (non-uniform spacing)
    const [x0, x1, x2] = [xs[i - 1], xs[i], xs[i + 1]];
    const [y0, y1, y2] = [s[i - 1], s[i], s[i + 1]].map((v) => Math.log(v + 1e-12));
    const denom = (x0 - x1) * (x0 - x2) * (x1 - x2);
    if (denom !== 0) {
      const A = (x2 * (y1 - y0) + x1 * (y0 - y2) + x0 * (y2 - y1)) / denom;
      const B = (x2 * x2 * (y0 - y1) + x1 * x1 * (y2 - y0) + x0 * x0 * (y1 - y2)) / denom;
      if (A < 0) peak = Math.min(x2, Math.max(x0, -B / (2 * A)));
    }
  }

  const sorted = [...s].sort((a, b) => a - b);
  const median = sorted[Math.floor(n / 2)] || 1e-12;
  const ratio = s[i] / median;

  // uncertainty: the best-focus region widened by half a step on each side
  const half = (k) => Math.abs(xs[Math.min(k + 1, n - 1)] - xs[Math.max(k - 1, 0)]) / 4;
  const dMin = Math.max(0, xs[a] - half(a));
  const dMax = xs[b] + half(b);

  // frame shown = the one closest to the estimate
  let index = a;
  for (let k = a; k <= b; k++) if (Math.abs(xs[k] - peak) < Math.abs(xs[index] - peak)) index = k;

  return {
    index,
    diopter: peak,
    dMin, // far bound (diopters)
    dMax, // near bound (diopters)
    ratio,
    edge: a === 0 ? 'far' : b === n - 1 ? 'near' : null,
    smoothed: s,
  };
}

// ---- camera.js ----
// Wraps getUserMedia + the Image Capture focus constraints.
class Camera {
  constructor(video) {
    this.video = video;
    this.stream = null;
    this.track = null;
    this.caps = {};
  }

  get active() {
    return !!this.stream;
  }

  async start() {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Camera API unavailable (needs HTTPS or localhost).');
    }
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      },
    });
    this.video.srcObject = this.stream;
    await this.video.play();
    this.track = this.stream.getVideoTracks()[0];
    // Some browsers only fill in capabilities once frames are flowing.
    await this.waitFrames(2);
    this.caps = this.track.getCapabilities ? this.track.getCapabilities() : {};
  }

  stop() {
    this.stream?.getTracks().forEach((t) => t.stop());
    this.stream = null;
    this.track = null;
    this.caps = {};
    this.video.srcObject = null;
  }

  /** Returns {min, max, step} in meters, or null when manual focus isn't exposed. */
  get focusRange() {
    const fd = this.caps.focusDistance;
    const modes = this.caps.focusMode || [];
    if (!fd || !modes.includes('manual')) return null;
    if (!(fd.max > fd.min)) return null;
    return { min: fd.min, max: fd.max, step: fd.step || 0 };
  }

  async setFocus(distance) {
    await this.track.applyConstraints({
      advanced: [{ focusMode: 'manual', focusDistance: distance }],
    });
  }

  currentFocus() {
    const s = this.track?.getSettings ? this.track.getSettings() : {};
    return s.focusDistance;
  }

  async restoreAutoFocus() {
    const modes = this.caps.focusMode || [];
    const mode = modes.includes('continuous') ? 'continuous' : modes.includes('single-shot') ? 'single-shot' : null;
    if (!mode || !this.track) return;
    try {
      await this.track.applyConstraints({ advanced: [{ focusMode: mode }] });
    } catch {
      /* not critical */
    }
  }

  /** Waits for n fresh video frames to be presented. */
  waitFrames(n = 1) {
    return new Promise((resolve) => {
      let left = n;
      const v = this.video;
      const tick = () => {
        if (--left <= 0) return resolve();
        next();
      };
      const next = () =>
        v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
      next();
    });
  }
}

// ---- chart.js ----
// Sharpness-vs-focus-distance plot. X axis is log(diopters), labelled in meters
// (far on the left, near on the right).
const TICKS_M = [0.02, 0.03, 0.05, 0.07, 0.1, 0.15, 0.2, 0.3, 0.5, 0.7, 1, 1.5, 2, 3, 5, 10, 20, 50];

function label(m) {
  return m < 1 ? `${Math.round(m * 100)}cm` : `${m}m`;
}

function drawChart(canvas, xs, ys, { peakX = null, currentX = null } = {}) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!xs.length) return;

  const pad = { l: 8, r: 8, t: 10, b: 22 };
  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const maxY = Math.max(...ys) || 1;
  const minY = Math.min(...ys);
  // log scale: otherwise the few cm closest to the lens take up most of the width
  // (the ~infinity frame is drawn at the 20 m position)
  const lg = (x) => Math.log(Math.max(x, 0.05));
  const lMin = lg(minX);
  const lMax = lg(maxX);
  const px = (x) => pad.l + ((lg(x) - lMin) / (lMax - lMin || 1)) * (W - pad.l - pad.r);
  const py = (y) => H - pad.b - ((y - minY) / (maxY - minY || 1)) * (H - pad.t - pad.b);

  // grid + distance ticks
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = '#8b95a5';
  ctx.strokeStyle = '#2a313c';
  ctx.lineWidth = 1;
  ctx.textAlign = 'center';
  let lastLabelX = -Infinity;
  for (const m of TICKS_M) {
    const d = 1 / m;
    if (d < minX || d > maxX) continue;
    const x = px(d);
    ctx.beginPath();
    ctx.moveTo(x, pad.t);
    ctx.lineTo(x, H - pad.b);
    ctx.stroke();
    if (Math.abs(x - lastLabelX) > 34) {
      ctx.fillText(label(m), x, H - 6);
      lastLabelX = x;
    }
  }

  // best-focus marker
  if (peakX != null) {
    ctx.strokeStyle = '#ffb347';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px(peakX), pad.t);
    ctx.lineTo(px(peakX), H - pad.b);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // curve
  ctx.strokeStyle = '#4cc2ff';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  xs.forEach((x, i) => (i ? ctx.lineTo(px(x), py(ys[i])) : ctx.moveTo(px(x), py(ys[i]))));
  ctx.stroke();

  // current frame
  if (currentX != null) {
    const i = xs.indexOf(currentX);
    if (i >= 0) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(px(currentX), py(ys[i]), 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ---- sweep.js ----
// Builds a focus stack: [{gray, width, height, img, distance, diopter}], sorted far -> near.

const grabCanvas = document.createElement('canvas');
const gctx = grabCanvas.getContext('2d', { willReadFrequently: true });

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/**
 * Grabs `samples` consecutive new video frames and averages them. Sensor noise
 * is independent from frame to frame, so averaging lowers the noise floor of
 * the sharpness measure (≈ 1/√samples) and smooths the focus curve.
 */
async function grab(camera, maxWidth, samples) {
  const video = camera.video;
  const scale = Math.min(1, maxWidth / video.videoWidth);
  const w = Math.round(video.videoWidth * scale);
  const h = Math.round(video.videoHeight * scale);
  grabCanvas.width = w;
  grabCanvas.height = h;
  const sum = new Uint16Array(w * h);
  for (let k = 0; k < samples; k++) {
    if (k > 0) await camera.waitFrames(1);
    gctx.drawImage(video, 0, 0, w, h);
    const g = toGray(gctx.getImageData(0, 0, w, h));
    for (let i = 0; i < g.length; i++) sum[i] += g[i];
  }
  const gray = new Uint8ClampedArray(w * h);
  for (let i = 0; i < gray.length; i++) gray[i] = (sum[i] + (samples >> 1)) / samples;
  // keep a compact JPEG for display instead of full RGBA to save memory
  const blob = await new Promise((res) => grabCanvas.toBlob(res, 'image/jpeg', 0.85));
  const img = new Image();
  img.src = URL.createObjectURL(blob);
  await img.decode().catch(() => {});
  return { gray, width: w, height: h, img };
}

function releaseFrames(frames) {
  frames.forEach((f) => URL.revokeObjectURL(f.img.src));
}

const FAR_LIMIT = 10; // m; beyond this phone lenses can't tell distances apart

/**
 * Focus distances (m) for the sweep, near -> far, deduplicated.
 * Log-spaced (equal ratio between steps) from the closest focus to 10 m, plus
 * one frame at the far end (~infinity). Uniform-in-diopter spacing put 28 of
 * 30 steps under 30 cm and left nothing between 58 cm and infinity.
 */
function plan({ min, max, step }, steps) {
  const near = Math.max(min, 0.02);
  const far = Math.min(max, FAR_LIMIT);
  const out = [];
  const add = (d) => {
    let dist = Math.min(max, Math.max(min, d));
    if (step > 0) dist = Math.min(max, min + Math.round((dist - min) / step) * step);
    if (!out.some((x) => Math.abs(x - dist) / dist < 1e-3)) out.push(dist);
  };
  for (let i = 0; i < steps; i++) add(near * Math.pow(far / near, i / (steps - 1)));
  if (max > far) add(Math.min(max, 1000));
  return out;
}

/** Steps the lens through its focus range and grabs a frame at each step. */
async function captureSweep(camera, { steps, settleMs, maxWidth, samples = 1, onProgress }) {
  const dists = plan(camera.focusRange, steps);
  const frames = [];

  // Pre-position the lens and let it fully arrive before the first grab.
  // Autofocus has usually just focused on the subject, so a frame grabbed
  // before the lens has really moved looks sharp at the first (nearest) step.
  await camera.setFocus(dists[0]);
  await sleep(Math.max(1000, settleMs * 4));
  await camera.waitFrames(3);

  for (let i = 0; i < dists.length; i++) {
    const dist = dists[i];
    onProgress?.(i, dists.length, dist);
    if (i > 0) {
      await camera.setFocus(dist);
      await sleep(settleMs);
    }
    await camera.waitFrames(2);
    const reported = camera.currentFocus();
    const actual = Number.isFinite(reported) && reported > 0 ? reported : dist;
    const f = await grab(camera, maxWidth, samples);
    f.distance = actual;
    f.diopter = 1 / actual;
    frames.push(f);
  }
  onProgress?.(dists.length, dists.length, null);
  return frames.sort((a, b) => a.diopter - b.diopter);
}

// ---- main.js ----




// Tuning constants
const STEPS = 30; // focus steps per sweep
const SETTLE_MS = 250; // wait after each lens move
const RADIUS = 24; // half-size of the measuring window (frame px)
const MAX_WIDTH = 1280; // analysis frame width
const FRAMES_PER_STEP = 3; // frames averaged at each focus step (noise reduction)

const $ = (id) => document.getElementById(id);
const el = {
  video: $('video'),
  canvas: $('frameCanvas'),
  hint: $('hint'),
  status: $('status'),
  progress: $('progress'),
  progressBar: $('progressBar'),
  mainBtn: $('mainBtn'),
  reviewPanel: $('reviewPanel'),
  frameSlider: $('frameSlider'),
  frameLabel: $('frameLabel'),
  newSweepBtn: $('newSweepBtn'),
  resultPanel: $('resultPanel'),
  distanceOut: $('distanceOut'),
  resultMeta: $('resultMeta'),
  chart: $('chart'),
};

const camera = new Camera(el.video);
const ctx = el.canvas.getContext('2d');

let frames = [];
let current = 0;
let point = null; // {x, y} in frame pixels
let result = null; // {peak, values}
let busy = false;

/* ---------- helpers ---------- */

function setStatus(msg, kind = '') {
  el.status.textContent = msg;
  el.status.className = `status ${kind}`;
}

function setProgress(frac) {
  el.progress.classList.toggle('hidden', frac == null);
  if (frac != null) el.progressBar.style.transform = `scaleX(${frac})`;
}

function fmtDist(m) {
  if (!Number.isFinite(m) || m <= 0 || m > 200) return '∞';
  if (m < 1) return `${(m * 100).toFixed(m < 0.3 ? 1 : 0)} cm`;
  if (m < 10) return `${m.toFixed(2)} m`;
  return `${m.toFixed(1)} m`;
}

/* ---------- live ---------- */

function showLive() {
  el.video.classList.remove('hidden');
  el.canvas.classList.add('hidden');
  el.mainBtn.classList.remove('hidden');
  el.reviewPanel.classList.add('hidden');
  el.resultPanel.classList.add('hidden');
  el.hint.classList.toggle('hidden', camera.active);
}

async function onMainBtn() {
  if (busy) return;
  if (!camera.active) return startCamera();
  return runSweep();
}

async function startCamera() {
  setStatus('Starting camera…');
  try {
    await camera.start();
  } catch (e) {
    camera.stop();
    setStatus(
      e.name === 'NotAllowedError' ? 'Camera access was blocked. Allow camera access for this site and reload.' : `Camera error: ${e.name}: ${e.message}`,
      'err'
    );
    return;
  }
  el.hint.classList.add('hidden');
  const r = camera.focusRange;
  if (!r) {
    setStatus('This camera/browser does not allow manual focus control, so a focus sweep is not possible.', 'err');
    el.mainBtn.disabled = true;
    return;
  }
  el.mainBtn.textContent = '🎯 Capture focus sweep';
  setStatus(`Manual focus ${fmtDist(r.min)} – ${fmtDist(r.max)}. Aim, hold steady, then capture.`, 'ok');
}

async function runSweep() {
  busy = true;
  el.mainBtn.disabled = true;
  releaseFrames(frames);
  frames = [];
  try {
    frames = await captureSweep(camera, {
      steps: STEPS,
      settleMs: SETTLE_MS,
      maxWidth: MAX_WIDTH,
      samples: FRAMES_PER_STEP,
      onProgress: (i, n, d) => {
        setProgress(i / n);
        if (d != null) setStatus(`Capturing ${i + 1}/${n} — focus at ${fmtDist(d)}. Keep still…`);
      },
    });
  } catch (e) {
    setStatus(`Sweep failed: ${e.message}`, 'err');
    return;
  } finally {
    await camera.restoreAutoFocus();
    setProgress(null);
    busy = false;
    el.mainBtn.disabled = false;
  }
  enterReview();
}

/* ---------- review / measure ---------- */

function enterReview() {
  if (frames.length < 3) {
    setStatus('Too few distinct focus steps captured.', 'err');
    return;
  }
  const f = frames[0];
  el.canvas.width = f.width;
  el.canvas.height = f.height;
  el.video.classList.add('hidden');
  el.canvas.classList.remove('hidden');
  el.mainBtn.classList.add('hidden');
  el.reviewPanel.classList.remove('hidden');
  el.resultPanel.classList.add('hidden');
  el.frameSlider.max = String(frames.length - 1);
  current = Math.floor(frames.length / 2);
  el.frameSlider.value = String(current);
  point = null;
  result = null;
  el.hint.textContent = 'Tap the point to measure';
  el.hint.classList.remove('hidden');
  setStatus(`Captured ${frames.length} frames. Tap a point with some texture or edges.`, 'ok');
  drawFrame();
}

function drawFrame() {
  const f = frames[current];
  if (!f) return;
  ctx.drawImage(f.img, 0, 0, f.width, f.height);
  el.frameLabel.textContent = `${current + 1}/${frames.length} · focus ${fmtDist(f.distance)}`;
  if (point) {
    const r = RADIUS;
    const lw = Math.max(2, f.width / 400);
    ctx.lineWidth = lw * 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeRect(point.x - r, point.y - r, 2 * r, 2 * r);
    ctx.lineWidth = lw;
    ctx.strokeStyle = '#ffb347';
    ctx.strokeRect(point.x - r, point.y - r, 2 * r, 2 * r);
  }
  if (result) renderChart();
}

function renderChart() {
  drawChart(el.chart, frames.map((f) => f.diopter), result.values, {
    peakX: result.peak.diopter,
    currentX: frames[current].diopter,
  });
}

function measure() {
  const values = sharpnessCurve(frames, point.x, point.y, RADIUS);
  const peak = findPeak(frames.map((f) => f.diopter), values);
  if (!peak) return;
  result = { peak, values };
  current = peak.index;
  el.frameSlider.value = String(current);
  el.hint.classList.add('hidden');
  el.resultPanel.classList.remove('hidden');
  renderResult();
  drawFrame();
}

function renderResult() {
  const { peak } = result;
  el.distanceOut.textContent =
    peak.edge === 'far' ? `≥ ${fmtDist(1 / peak.dMax)}` : fmtDist(peak.diopter > 0 ? 1 / peak.diopter : Infinity);

  const quality = peak.ratio > 3 ? 'good' : peak.ratio > 1.6 ? 'fair' : 'low';
  const far = peak.dMin > 0 ? 1 / peak.dMin : Infinity;
  let html = `Range ≈ ${fmtDist(1 / peak.dMax)} – ${fmtDist(far)} · confidence <b>${quality}</b>`;
  if (peak.edge === 'near') html += `<br><span class="warn">⚠ Sharpest at the nearest steps: the point may be closer than the lens can focus.</span>`;
  if (peak.edge === 'far') html += `<br><span class="warn">⚠ Sharp all the way to the far end: the point is at least ${fmtDist(1 / peak.dMax)} away (beyond that, focus can't tell distances apart).</span>`;
  if (quality === 'low') html += `<br><span class="warn">⚠ Weak focus peak: try a spot with more texture or edges.</span>`;
  el.resultMeta.innerHTML = html;
}

function onCanvasTap(e) {
  if (!frames.length || busy) return;
  const rect = el.canvas.getBoundingClientRect();
  point = {
    x: ((e.clientX - rect.left) / rect.width) * el.canvas.width,
    y: ((e.clientY - rect.top) / rect.height) * el.canvas.height,
  };
  measure();
}

/* ---------- events ---------- */

el.mainBtn.addEventListener('click', onMainBtn);
el.canvas.addEventListener('click', onCanvasTap);
el.frameSlider.addEventListener('input', () => {
  current = Number(el.frameSlider.value);
  drawFrame();
});
el.newSweepBtn.addEventListener('click', () => {
  releaseFrames(frames);
  frames = [];
  result = null;
  point = null;
  showLive();
  setStatus('Aim, hold steady, then capture.', 'ok');
});
window.addEventListener('resize', () => result && renderChart());

showLive();
</script>
</body>
</html>
